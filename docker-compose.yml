services:
  frontend:
    build:
      context: ./frontend
      args:
        # URL pubblico del backend visto dal browser
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
        VITE_USE_MOCK: ${VITE_USE_MOCK:-true}
    ports:
      - "8080:80"
    restart: unless-stopped


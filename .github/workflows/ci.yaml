name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
  runs-on: ubuntu-latest  
  strategy:
    matrix:
      python-version: ["3.12", "3.13"]
    service:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: eventi
          POSTGRES_PASSWORD: eventi
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U eventi"

  steps:
    - usessteps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: 3.12
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest --ccv=app
